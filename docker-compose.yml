services:
  postgres:
    image: postgres:15
    container_name: de_projet_10-postgres
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 5s
      timeout: 5s
      retries: 5

  kestra:
    image: kestra/kestra:latest
    container_name: de_projet_10-kestra
    # CRUCIAL : Lance Kestra en mode serveur pour accéder à l'interface web
    command: server standalone 
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: kestra
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
    volumes:
      - kestra_data:/app/storage
      - ./kestra/flows:/app/flows
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./duckdb:/app/duckdb

volumes:
  postgres_data:
  kestra_data: