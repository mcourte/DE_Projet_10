id: tests
namespace: bottleneck
description: |
  Tests SQL finaux sur les tables DuckDB produites par le pipeline.
  Couvre les 5 categories de tests imposees par le brief OpenClassrooms :
    1. Absence de doublons
    2. Absence de valeurs manquantes (completude)
    3. Coherence de la volumetrie apres jointures
    4. Coherence du chiffre d'affaires calcule
    5. Coherence de la volumetrie millesimes/ordinaires avec le z-score

tasks:
  # --- Test 1 : Absence de doublons ----------------------------------------
  - id: test_doublons
    type: io.kestra.plugin.scripts.python.Script
    description: TEST 1/5 - Aucun doublon sur les cles primaires
    runner: PROCESS
    beforeCommands:
      - pip install -q duckdb pandas
    script: |
      import os
      import sys
      
      os.chdir('/app')
      sys.path.insert(0, '/app')
      from scripts.python.load_to_duckdb import query, get_connection

      sql = open('/app/scripts/sql/tests/test_doublons.sql', encoding='utf-8').read()
      with get_connection() as conn:
          result = int(query(sql, conn=conn).iloc[0, 0])
          
      assert result == 0, f"doublons detectes : {result}"
      print("[TEST 1/5] Doublons OK (0)")

  # --- Test 2 : Absence de valeurs manquantes ------------------------------
  - id: test_completude
    type: io.kestra.plugin.scripts.python.Script
    description: TEST 2/5 - Aucune valeur manquante sur colonnes critiques
    runner: PROCESS
    beforeCommands:
      - pip install -q duckdb pandas
    script: |
      import os
      import sys
      
      os.chdir('/app')
      sys.path.insert(0, '/app')
      from scripts.python.load_to_duckdb import query, get_connection

      sql = open('/app/scripts/sql/tests/test_completude.sql', encoding='utf-8').read()
      with get_connection() as conn:
          result = int(query(sql, conn=conn).iloc[0, 0])
          
      assert result == 0, f"valeurs manquantes : {result}"
      print("[TEST 2/5] Completude OK (0)")

  # --- Test 3 : Coherence volumetrie apres jointures -----------------------
  - id: test_volumetrie_jointure
    type: io.kestra.plugin.scripts.python.Script
    description: TEST 3/5 - Volumetrie apres jointures = 714 produits
    runner: PROCESS
    beforeCommands:
      - pip install -q duckdb pandas
    script: |
      import os
      import sys
      
      os.chdir('/app')
      sys.path.insert(0, '/app')
      from scripts.python.load_to_duckdb import query, get_connection

      sql = open('/app/scripts/sql/tests/test_volumetrie_jointure.sql', encoding='utf-8').read()
      with get_connection() as conn:
          ecart = int(query(sql, conn=conn).iloc[0, 0])
          
      assert ecart == 0, f"volumetrie hors cible : ecart = {ecart}"
      print("[TEST 3/5] Volumetrie jointure OK (714 produits)")

  # --- Test 4 : Coherence du chiffre d'affaires ----------------------------
  - id: test_ca
    type: io.kestra.plugin.scripts.python.Script
    description: TEST 4/5 - CA total = 70 568.60 EUR
    runner: PROCESS
    beforeCommands:
      - pip install -q duckdb pandas
    script: |
      import os
      import sys
      
      os.chdir('/app')
      sys.path.insert(0, '/app')
      from scripts.python.load_to_duckdb import query, get_connection

      sql = open('/app/scripts/sql/tests/test_ca.sql', encoding='utf-8').read()
      with get_connection() as conn:
          ecart = float(query(sql, conn=conn).iloc[0, 0])
          
      assert ecart < 1.0, f"CA hors cible : ecart = {ecart} EUR"
      print(f"[TEST 4/5] CA total OK (ecart = {ecart} EUR)")

  # --- Test 5 : Coherence z-score millesimes/ordinaires --------------------
  - id: test_zscore
    type: io.kestra.plugin.scripts.python.Script
    description: TEST 5/5 - Coherence classification z-score (30 / 684)
    runner: PROCESS
    beforeCommands:
      - pip install -q duckdb pandas
    script: |
      import os
      import sys
      
      os.chdir('/app')
      sys.path.insert(0, '/app')
      from scripts.python.load_to_duckdb import query, get_connection

      sql = open('/app/scripts/sql/tests/test_zscore.sql', encoding='utf-8').read()
      with get_connection() as conn:
          violations = int(query(sql, conn=conn).iloc[0, 0])
          
      assert violations == 0, f"violations z-score detectees : {violations}"
      print("[TEST 5/5] Z-score OK (30 millesimes / 684 ordinaires)")

  # --- Tests historiques (types et plage dates) ----------------------------
  - id: test_types
    type: io.kestra.plugin.scripts.python.Script
    description: TEST bonus - TRY_CAST sur price et stock_quantity
    runner: PROCESS
    beforeCommands:
      - pip install -q duckdb pandas
    script: |
      import os
      import sys
      
      os.chdir('/app')
      sys.path.insert(0, '/app')
      from scripts.python.load_to_duckdb import query, get_connection

      sql = open('/app/scripts/sql/tests/test_types.sql', encoding='utf-8').read()
      with get_connection() as conn:
          result = int(query(sql, conn=conn).iloc[0, 0])
          
      assert result == 0, f"erreurs de cast : {result}"
      print("[TEST bonus] Types OK")

  - id: test_plage_dates
    type: io.kestra.plugin.scripts.python.Script
    description: TEST bonus - post_date dans la plage [2018-01-01, today]
    runner: PROCESS
    beforeCommands:
      - pip install -q duckdb pandas
    script: |
      import os
      import sys
      
      os.chdir('/app')
      sys.path.insert(0, '/app')
      from scripts.python.load_to_duckdb import query, get_connection

      sql = open('/app/scripts/sql/tests/test_plage_dates.sql', encoding='utf-8').read()
      with get_connection() as conn:
          result = int(query(sql, conn=conn).iloc[0, 0])
          
      assert result == 0, f"dates hors plage : {result}"
      print("[TEST bonus] Plage dates OK")