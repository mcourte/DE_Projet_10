id: transformation
namespace: bottleneck

# Sous-flow de transformation : nettoyage -> jointure -> classification ->
# CA -> persistance DuckDB -> rapport Excel.
# Chaque etape de transformation est suivie d'une tache de test.

description: |
  Pipeline de transformation BottleNeck.

  Cibles attendues :
    - WEB nettoye : 714 lignes (drop sku NaN -> 1428, puis dedup sku -> 714)
    - Jointure ERP/LIAISON/WEB : 714 produits
    - Classification : 30 premium, 684 ordinary (methode Z-score > 1.96 sur prix)
    - CA total : 70 568.60 EUR
    - Rapport Excel : data/processed/rapport_BottleNeck_YYYY-MM.xlsx

tasks:

  # --- ETAPE 1 : Nettoyage + test
  - id: clean_data
    type: io.kestra.plugin.scripts.python.Script
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q pandas openpyxl duckdb
    script: |
      import sys
      sys.path.insert(0, '.')
      from scripts.python.extract_files import read_bottleneck_sources
      from scripts.python.clean_data import clean_erp, clean_web, clean_liaison
      from scripts.python.load_to_duckdb import get_connection, write_table

      src = read_bottleneck_sources()
      erp = clean_erp(src['erp'])
      web = clean_web(src['web'])
      liaison = clean_liaison(src['liaison'])

      with get_connection() as conn:
          write_table(erp, 'erp_clean', conn=conn)
          write_table(web, 'web_clean', conn=conn)
          write_table(liaison, 'liaison_clean', conn=conn)
    retry:
      type: exponential
      maxAttempt: 3
      interval: PT10S

  - id: test_clean_data
    type: io.kestra.plugin.scripts.python.Script
    description: TEST - volumetries cibles ERP=825, LIAISON=825, WEB dedup=714
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q duckdb
    script: |
      import sys
      sys.path.insert(0, '.')
      from scripts.python.load_to_duckdb import query

      n_erp     = query("SELECT COUNT(*) AS n FROM erp_clean").iloc[0]['n']
      n_liaison = query("SELECT COUNT(*) AS n FROM liaison_clean").iloc[0]['n']
      n_web     = query("SELECT COUNT(*) AS n FROM web_clean").iloc[0]['n']
      assert n_erp == 825,     f"ERP : attendu 825, recu {n_erp}"
      assert n_liaison == 825, f"LIAISON : attendu 825, recu {n_liaison}"
      assert n_web == 714,     f"WEB dedup : attendu 714, recu {n_web}"
      print(f"[TEST] OK : ERP={n_erp}, LIAISON={n_liaison}, WEB={n_web}")

  # --- ETAPE 2 : Jointure + test
  - id: join_sources
    type: io.kestra.plugin.scripts.python.Script
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q pandas openpyxl duckdb
    script: |
      import sys
      sys.path.insert(0, '.')
      from scripts.python.join_data import join_sources
      from scripts.python.load_to_duckdb import get_connection, query, write_table

      with get_connection() as conn:
          erp = query("SELECT * FROM erp_clean", conn=conn)
          web = query("SELECT * FROM web_clean", conn=conn)
          liaison = query("SELECT * FROM liaison_clean", conn=conn)
          full = join_sources(erp, web, liaison)
          write_table(full, 'produits_joints', conn=conn)
    retry:
      type: exponential
      maxAttempt: 3
      interval: PT10S

  - id: test_join_sources
    type: io.kestra.plugin.scripts.python.Script
    description: TEST - jointure produit 714 lignes
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q duckdb
    script: |
      import sys
      sys.path.insert(0, '.')
      from scripts.python.load_to_duckdb import query

      n = query("SELECT COUNT(*) AS n FROM produits_joints").iloc[0]['n']
      assert n == 714, f"Jointure : attendu 714, recu {n}"
      print(f"[TEST] Jointure OK ({n} produits consolides)")

  # --- ETAPE 3 : Classification + test
  - id: classify_wines
    type: io.kestra.plugin.scripts.python.Script
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q pandas duckdb numpy
    script: |
      import sys
      sys.path.insert(0, '.')
      from scripts.python.identify_wines import classify_wines
      from scripts.python.load_to_duckdb import get_connection, query, write_table

      with get_connection() as conn:
          full = query("SELECT * FROM produits_joints", conn=conn)
          classified = classify_wines(full)
          write_table(classified, 'produits_consolides', conn=conn)
    retry:
      type: exponential
      maxAttempt: 3
      interval: PT10S

  - id: test_classify_wines
    type: io.kestra.plugin.scripts.python.Script
    description: TEST - 30 vins millesimes + 684 ordinaires + CA total = 70 568.60 EUR
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q duckdb
    script: |
      import sys
      sys.path.insert(0, '.')
      from scripts.python.load_to_duckdb import query

      df = query("""
          SELECT segment, COUNT(*) AS n
          FROM produits_consolides
          GROUP BY segment
      """)
      counts = dict(zip(df['segment'], df['n']))
      n_premium = counts.get('premium', 0)
      n_ordinary = counts.get('ordinary', 0)
      assert n_premium == 30,   f"Vins millesimes : attendu 30, recu {n_premium}"
      assert n_ordinary == 684, f"Vins ordinaires : attendu 684, recu {n_ordinary}"

      ca = float(query(
          "SELECT SUM(price * total_sales) AS ca FROM produits_consolides"
      ).iloc[0]['ca'])
      assert abs(ca - 70_568.60) < 1.0, f"CA total : attendu 70 568.60, recu {ca:.2f}"
      print(f"[TEST] Classification OK ({n_premium} millesimes / {n_ordinary} ordinaires, CA = {ca:.2f} EUR)")

  # --- ETAPE 4 : Rapport Excel
  - id: generate_report
    type: io.kestra.plugin.scripts.python.Script
    description: Generation du rapport Excel multi-onglets
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q pandas openpyxl duckdb numpy
    script: |
      import sys
      sys.path.insert(0, '.')
      from scripts.python.generate_reports import generate_excel_report
      from scripts.python.load_to_duckdb import query

      df = query("SELECT * FROM produits_consolides")
      out = generate_excel_report(df)
      print(f"Rapport ecrit : {out}")
    retry:
      type: exponential
      maxAttempt: 3
      interval: PT10S

  - id: test_report_exists
    type: io.kestra.plugin.scripts.python.Script
    description: TEST - le fichier Excel existe et a 4 onglets
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install -q openpyxl
    script: |
      from datetime import datetime
      from openpyxl import load_workbook
      from pathlib import Path

      path = Path(f"data/processed/rapport_BottleNeck_{datetime.now():%Y-%m}.xlsx")
      assert path.exists(), f"Rapport manquant : {path}"
      wb = load_workbook(path, read_only=True)
      expected = {'CA_par_produit', 'CA_total', 'Vins_premium', 'Vins_ordinaires'}
      missing = expected - set(wb.sheetnames)
      assert not missing, f"Onglets manquants : {missing}"
      print(f"[TEST] Rapport OK : {path} ({len(wb.sheetnames)} onglets)")
