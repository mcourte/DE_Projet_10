id: 00_main_pipeline
namespace: bottleneck # Mis à jour
description: Pipeline principal BottleNeck — Extraction, Transformation et Tests.

tasks:
  - id: trigger_extraction
    type: io.kestra.core.tasks.flows.Subflow
    flowId: extraction # Nom de ton premier fichier
    namespace: bottleneck
    wait: true

  - id: trigger_transformation
    type: io.kestra.core.tasks.flows.Subflow
    flowId: transformation # Nom de ton deuxième fichier
    namespace: bottleneck
    wait: true

  - id: trigger_validation_reports
    type: io.kestra.core.tasks.flows.Subflow
    flowId: tests # Nom de ce fichier-ci
    namespace: bottleneck
    wait: true

triggers:
  - id: monthly_schedule
    type: io.kestra.core.models.triggers.types.Schedule
    cron: "0 9 15 * *"
    timezone: Europe/Paris