id: extraction
namespace: bottleneck
description: |
  Lit les 3 fichiers sources :
    - Fichier_erp.xlsx     (cible : 825 lignes)
    - Fichier_web.xlsx     (cible : 1513 lignes)
    - fichier_liaison.xlsx (cible : 825 lignes)
  Charge en RAM via pandas. Les eventuels fichiers illisibles sont
  deplaces vers data/rejected/ par le script Python.

tasks:
  - id: extract_sources
    type: io.kestra.plugin.scripts.python.Commands
    description: Extraction des fichiers sources via extract_files.py
    runner: PROCESS
    beforeCommands:
      - pip install -q pandas openpyxl
    commands:
      - export PYTHONPATH="${PYTHONPATH}:/app"
      - cd /app
      - python -m scripts.python.extract_files
    retry:
      type: exponential
      maxAttempt: 3
      interval: PT10S
      maxInterval: PT5M

  - id: test_extraction_volumetrie
    type: io.kestra.plugin.scripts.python.Script
    description: Verifie la volumetrie des sources extraites (TEST)
    runner: PROCESS
    beforeCommands:
      - pip install -q pandas openpyxl
    script: |
      import sys
      import os
      

      os.chdir('/app')
      sys.path.insert(0, '/app')
      
      from scripts.python.extract_files import read_bottleneck_sources

      sources = read_bottleneck_sources()
      assert len(sources['erp']) == 825, f"ERP : attendu 825, recu {len(sources['erp'])}"
      assert len(sources['web']) == 1513, f"WEB : attendu 1513, recu {len(sources['web'])}"
      assert len(sources['liaison']) == 825, f"LIAISON : attendu 825, recu {len(sources['liaison'])}"
      print("[TEST] Volumetrie extraction OK")

errors:
  - id: move_to_rejected
    type: io.kestra.plugin.core.log.Log
    message: |
      Echec extraction. Verifier les fichiers dans data/raw/bottleneck/.
      Execution : {{ execution.id }}