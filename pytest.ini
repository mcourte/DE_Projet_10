[pytest]
testpaths = tests
markers =
    cibles: chiffres EXACTS de la POC BottleNeck (cf. test_chiffres_bottleneck.py). Ces tests ne valent QUE sur le dataset initial validé par Stéphane.
    integration: tests qui nécessitent une base DuckDB existante (lancer run_pipeline.py avant).
addopts = -ra --strict-markers
filterwarnings =
    ignore::UserWarning:openpyxl.*
